{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Add Book</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <nav>
        <h1>📚 Add New Book</h1>
        <a href="/">Home</a>
    </nav>

    <div class="container">
        <div class="book-card">
            <h2>Add a New Book</h2>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Add Book</button>
            </form>
        </div>
    </div>

</body>
</html>
